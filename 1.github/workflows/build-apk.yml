name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Android_App/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        shell: bash
        run: |
          test -f Android_App/settings.gradle.kts
          test -f Android_App/build.gradle.kts
          test -f Android_App/app/build.gradle.kts
          test -f Android_App/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: Android_App
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp Android_App/app/build/outputs/apk/debug/app-debug.apk artifacts/PriceMatcher-Remote-v2.2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceMatcher-Remote-APK
          path: artifacts/PriceMatcher-Remote-v2.2-debug.apk
          if-no-files-found: error
          retention-days: 30
